name: Compilar e publicar (Web)

# Em Pull Requests: importa, testa e exporta, mas NÃO publica (versão em revisão).
# No main (depois do merge) ou manualmente: faz tudo isso e publica no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Reaproveitar o Godot já baixado
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Baixar o Godot e os modelos de exportação web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$DEST"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$DEST"

      - name: Importar o projeto
        run: |
          mkdir -p build/web
          touch build/.gdignore
          ~/godot/godot --headless --path . --import

      - name: Testes automáticos (progressão, melhorias, pausa, reinício)
        run: ~/godot/godot --headless --path . --fixed-fps 60 --script res://tests/run_tests.gd

      - name: Teste rápido de ponta a ponta (smoke test)
        run: ~/godot/godot --headless --path . --fixed-fps 60 --script res://tests/smoke_test.gd

      - name: Simulação prolongada (5 minutos de partida)
        run: ~/godot/godot --headless --path . --fixed-fps 60 --script res://tests/long_simulation.gd -- --segundos=300

      - name: Exportar para Web
        run: ~/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - name: Verificar os arquivos exportados
        run: |
          for f in index.html index.js index.pck index.wasm; do
            test -s "build/web/$f" || { echo "Faltando ou vazio: $f"; exit 1; }
          done
          ls -la build/web

      - name: Guardar a versão web para download (Pull Request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: versao-web
          path: build/web

      - name: Preparar o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Enviar a versão web
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
