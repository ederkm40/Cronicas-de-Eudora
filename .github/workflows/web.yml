name: Compilar e publicar (Web)

# Roda a cada envio para o main, ou manualmente pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Reaproveitar o Godot já baixado
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Baixar o Godot e os modelos de exportação web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$DEST"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$DEST"

      - name: Importar o projeto
        run: |
          mkdir -p build/web
          touch build/.gdignore
          ~/godot/godot --headless --path . --import

      - name: Teste rápido (smoke test)
        run: ~/godot/godot --headless --path . --fixed-fps 60 --script res://tests/smoke_test.gd

      - name: Exportar para Web
        run: |
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html && test -f build/web/index.pck && test -f build/web/index.wasm

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a versão web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
