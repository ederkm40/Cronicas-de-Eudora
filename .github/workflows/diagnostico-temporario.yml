name: Diagnóstico temporário (será removido antes do PR)
on:
  push:
    branches: [infra/ferramentas-qa-web]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: gdformat e gdlint
        run: |
          python -m venv /tmp/gd && /tmp/gd/bin/pip install -q gdtoolkit==4.5.0
          ARQS="scripts/camera_rig.gd scripts/player.gd scripts/level_up_panel.gd scripts/upgrades.gd scripts/auto_weapon.gd scripts/enemy_manager.gd tests/run_tests.gd tests/smoke_test.gd tests/long_simulation.gd"
          cp -r . /tmp/copia && cd /tmp/copia
          /tmp/gd/bin/gdformat $ARQS
          echo "== DIFF INICIO"; git -c core.quotepath=off diff -- $ARQS | base64 -w0; echo; echo "== DIFF FIM"
          echo "== gdlint depois"; /tmp/gd/bin/gdlint scripts tests || true
